[tool.black]
line-length = 90
target-version = ['py39']
skip-string-normalization = true

exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # Ignorar as migrações é uma boa prática
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["produtos", "vendas", "usuarios", "setup"]